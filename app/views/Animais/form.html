#{extends 'main.html' /}
#{set title:'Cadastro de Animais' /}

<h1>Cadastro de Animais</h1>

<form action="@{Animais.salvar}" method="POST">

	<input type="hidden" name="animal.id" value="${a?.id}" />

	<label>Nome:</label><br />
	<input type="text" name="animal.nome" value="${a?.nome}" /><br />

	<label>Peso:</label><br />
	<input type="text" name="animal.peso" value="${a?.peso}" /><br />

	<label>Data de Nascimento:</label><br />
	<input type="date" name="animal.dataNascimento" value="${a?.dataNascimento}" /><br />
	
	<label>Selecione o tipo:</label>
	<select name="animal.tipoAnimal.id">
		#{list items:tipos, as:'t'}
		<option value="${t.id}">${t.nome}</option>
		#{/list}
	</select>
	<br />

	<input type="submit" />
</form>
